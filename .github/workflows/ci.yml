name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose
      - run: cargo test --verbose

  native-tls:
    name: Test with the OpenSSL backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --features native-tls --verbose

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep this in step with rust-version in Cargo.toml. OpenWrt 24.10 ships
      # this toolchain, so it is the floor the package build actually needs.
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo check --all-targets --no-default-features --features native-tls

  fuzz:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Building only: a real campaign belongs in a scheduled run or OSS-Fuzz.
      # This keeps the targets compiling as the code they exercise changes.
      - run: cargo fuzz build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  cross:
    name: ${{ matrix.target }} (${{ matrix.tls }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
        tls: [rustls-tls]
        include:
          # Proves the OpenSSL backend cross-builds, the configuration targets
          # without ring support (such as PowerPC) have to use. Vendored here
          # because the cross image has no OpenSSL for the target; OpenWrt
          # builds use plain `native-tls` against the SDK's libopenssl.
          - target: aarch64-unknown-linux-musl
            tls: vendored-openssl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.tls }}
      - uses: actions/upload-artifact@v4
        with:
          name: librespeed-cli-${{ matrix.target }}-${{ matrix.tls }}
          path: target/${{ matrix.target }}/release/librespeed-cli
          if-no-files-found: error
